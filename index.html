<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuval Hatami - Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page_background"></div>

    <input type="checkbox" id="change_backround_checkbox" style="display: none;">
    <label for="change_backround_checkbox" class="change_backround_button">
        🌙/☀️
    </label>

    <div class="my_card">
        <div class="card_header">
            <div class="image_container">
                <img src="gengar_pic.jpeg" alt="Gengar Avatar" class="user_picture">
            </div>

            <h1>Yuval Hatami</h1>
            <h2>SecOps & Developer</h2>

            <div class="pokemon_types">
                <span class="type poison">Security</span>
                <span class="type ghost">Code</span>
            </div>
        </div>

        <div class="card_body">
            <p>Level 25 Tech enthusiast. Exploring algorithms, network security, and building solid infrastructure. Always ready for the next battle.</p>

            <div class="stats_container">
                <div class="stat_row">
                    <span class="stat_name">HP</span>
                    <div class="stat_bar"><div class="stat_fill hp"></div></div>
                </div>
                <div class="stat_row">
                    <span class="stat_name">ATK</span>
                    <div class="stat_bar"><div class="stat_fill atk"></div></div>
                </div>
                <div class="stat_row">
                    <span class="stat_name">DEF</span>
                    <div class="stat_bar"><div class="stat_fill def"></div></div>
                </div>
            </div>

            <div class="button_grid">
                <a href="https://www.linkedin.com/in/yuval-hatami" class="action_btn linkedin_btn">LinkedIn</a>
                <a href="https://github.com/yuvalhtm05" class="action_btn github_btn">GitHub</a>
                <a href="mailto:yuvalhtm05@gmail.com" class="action_btn email_btn">Email</a>
                <a href="tel:+972558823232" class="action_btn call_btn">Call Me</a>
            </div>
        </div>
    </div>
</body>
</html>
